<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Region Select</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.12);
      cursor: crosshair;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #instructions {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 16px;
      color: #f7fbff;
      background: rgba(10, 18, 28, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
      transition: opacity 120ms ease;
      max-width: min(420px, calc(100vw - 32px));
    }

    #instructions.hidden {
      opacity: 0;
    }

    #selection {
      position: fixed;
      display: none;
      border: 2px solid #00aaff;
      background: rgba(0, 170, 255, 0.14);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }
  </style>
</head>
<body tabindex="0">
  <div id="instructions">Drag to select a region. Press Escape to cancel.</div>
  <div id="selection"></div>

  <script>
    const selection = document.getElementById('selection');
    const instructions = document.getElementById('instructions');

    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function send(channel, data) {
      if (window.api && typeof window.api.send === 'function') {
        window.api.send(channel, data);
      }
    }

    function getBounds(currentX, currentY) {
      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);
      return { x, y, width, height };
    }

    function drawSelection(bounds) {
      selection.style.display = 'block';
      selection.style.left = `${bounds.x}px`;
      selection.style.top = `${bounds.y}px`;
      selection.style.width = `${bounds.width}px`;
      selection.style.height = `${bounds.height}px`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.body.focus();
    });

    window.addEventListener('mousedown', (event) => {
      if (event.button !== 0) return;

      isDragging = true;
      startX = event.clientX;
      startY = event.clientY;
      instructions.classList.add('hidden');
      drawSelection({ x: startX, y: startY, width: 0, height: 0 });
    });

    window.addEventListener('mousemove', (event) => {
      if (!isDragging) return;
      drawSelection(getBounds(event.clientX, event.clientY));
    });

    window.addEventListener('mouseup', (event) => {
      if (!isDragging) return;

      isDragging = false;
      const bounds = getBounds(event.clientX, event.clientY);

      if (bounds.width < 10 || bounds.height < 10) {
        send('selection-cancelled');
        return;
      }

      send('region-selected', bounds);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        send('selection-cancelled');
      }
    });
  </script>
</body>
</html>
