<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Region Select</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.12);
      cursor: crosshair;
      user-select: none;
    }

    body.stealth {
      background: transparent;
      cursor: default;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #instructions {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 16px;
      color: #f7fbff;
      background: rgba(10, 18, 28, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
      transition: opacity 120ms ease;
      max-width: min(420px, calc(100vw - 32px));
    }

    #instructions.hidden {
      opacity: 0;
    }

    #selection {
      position: fixed;
      display: none;
      border: 2px solid #00aaff;
      background: rgba(0, 170, 255, 0.14);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    .corner-marker {
      position: fixed;
      display: none;
      width: 26px;
      height: 26px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      color: #ffd23f;
      font-size: 22px;
      line-height: 26px;
      text-align: center;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.85), 0 0 8px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body tabindex="0">
  <div id="instructions">Drag to select a region. Press Escape to cancel.</div>
  <div id="selection"></div>
  <div id="marker-start" class="corner-marker">&#9733;</div>
  <div id="marker-end" class="corner-marker">&#9733;</div>

  <script>
    const selection = document.getElementById('selection');
    const instructions = document.getElementById('instructions');
    const markerStart = document.getElementById('marker-start');
    const markerEnd = document.getElementById('marker-end');

    const params = new URLSearchParams(window.location.search);
    const stealth = params.get('stealth') === '1';

    if (stealth) {
      document.body.classList.add('stealth');
      instructions.remove();
    }

    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function send(channel, data) {
      if (window.api && typeof window.api.send === 'function') {
        window.api.send(channel, data);
      }
    }

    function getBounds(currentX, currentY) {
      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);
      return { x, y, width, height };
    }

    function drawSelection(bounds) {
      selection.style.display = 'block';
      selection.style.left = `${bounds.x}px`;
      selection.style.top = `${bounds.y}px`;
      selection.style.width = `${bounds.width}px`;
      selection.style.height = `${bounds.height}px`;
    }

    function placeMarker(marker, x, y) {
      marker.style.left = `${x}px`;
      marker.style.top = `${y}px`;
      marker.style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.body.focus();
    });

    window.addEventListener('mousedown', (event) => {
      if (event.button !== 0) return;

      isDragging = true;
      startX = event.clientX;
      startY = event.clientY;

      if (stealth) {
        placeMarker(markerStart, startX, startY);
      } else {
        instructions.classList.add('hidden');
        drawSelection({ x: startX, y: startY, width: 0, height: 0 });
      }
    });

    window.addEventListener('mousemove', (event) => {
      if (!isDragging) return;
      if (stealth) return;
      drawSelection(getBounds(event.clientX, event.clientY));
    });

    window.addEventListener('mouseup', (event) => {
      if (!isDragging) return;

      isDragging = false;
      const bounds = getBounds(event.clientX, event.clientY);

      if (bounds.width < 10 || bounds.height < 10) {
        markerStart.style.display = 'none';
        markerEnd.style.display = 'none';
        send('selection-cancelled');
        return;
      }

      if (stealth) {
        placeMarker(markerEnd, event.clientX, event.clientY);
        setTimeout(() => send('region-selected', bounds), 180);
        return;
      }

      send('region-selected', bounds);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        send('selection-cancelled');
      }
    });
  </script>
</body>
</html>
